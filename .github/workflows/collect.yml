name: collect

on:
  push:
    branches: [main]
    paths: ["tools/collect/**", ".github/workflows/collect.yml"]
  pull_request:
    paths: ["tools/collect/**", ".github/workflows/collect.yml"]

permissions:
  contents: read

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install "./tools/collect[test]"
      # The tests use saved pages only: GitHub servers cannot reach the portal, and must not try.
      - name: Test
        working-directory: tools/collect
        run: python -m pytest -q
